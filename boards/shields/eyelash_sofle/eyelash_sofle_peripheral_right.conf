# RGB underglow (needs ext_power, see eyelash_sofle_central_left.conf for why)
CONFIG_ZMK_EXT_POWER=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# OLED display (hammerbeam-slideshow via nice_view_custom)
CONFIG_SPI=y
CONFIG_ZMK_DISPLAY=y
# Total slideshow duration in ms (30 pictures -> 10s each)
CONFIG_CUSTOM_ANIMATION_SPEED=300000
