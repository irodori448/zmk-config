# Rotary encoder (left half only)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Debug logging over USB (temporary, for diagnosing the RGB boot hang)
CONFIG_ZMK_USB_LOGGING=y

# RGB underglow (re-enabling to capture the boot hang via USB logging)
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment to enable the OLED display (only if your board has one)
# CONFIG_ZMK_DISPLAY=y
