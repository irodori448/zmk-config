# Rotary encoder (left half only)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow: needs ext_power enabled or the WS2812 SPI transfer hangs
# waiting on unpowered LEDs (nice_nano_v2 has a built-in power switch that
# was not being enabled before).
CONFIG_ZMK_EXT_POWER=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# OLED display (zmk-nice-oled, trying as alternative to nice_view_gem)
CONFIG_SPI=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
